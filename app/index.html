<style>
  :root {
    --bg: #f6f5f1;
    --surface: #ffffff;
    --surface-2: #f3f1ec;
    --border: #e7e3da;
    --border-strong: #d8d3c8;
    --ink: #1b1a17;
    --ink-2: #6d685e;
    --ink-3: #a39d92;
    --profit: #1f8a5b;
    --profit-bg: #e6f3ec;
    --loss: #d4504e;
    --loss-bg: #fbecea;
    --warn: #b9802a;
    --warn-bg: #f8efdd;
    --gold: #c79a16;
    --gold-bg: #faf1cf;
    --gold-ink: #8a6a08;
    --info: #2a6fdb;
    --info-bg: #eaf0fb;
    --accent: #1f8a5b;
    --font-display: "Space Grotesk", sans-serif;
    --font-mono: "IBM Plex Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Manrope", -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    font-size: 15px;
  }
  h1, h2, h3, h4 { color: var(--ink); }
  ::selection { background: color-mix(in oklab, var(--accent) 28%, transparent); }

  .tj-iconbtn {
    width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--border);
    background: var(--surface); color: var(--ink-2); display: inline-flex; align-items: center;
    justify-content: center; cursor: pointer; transition: all .15s; flex-shrink: 0;
  }
  .tj-iconbtn:hover { background: var(--surface-2); color: var(--ink); border-color: var(--border-strong); }
  .tj-del:hover { background: var(--loss-bg) !important; color: var(--loss) !important; border-color: var(--loss) !important; }

  .tj-textbtn {
    border: none; background: none; cursor: pointer; font-family: inherit; font-size: 13px;
    font-weight: 600; color: var(--accent); padding: 2px 0; transition: opacity .15s;
  }
  .tj-textbtn:hover { opacity: .68; }

  .tj-nav:hover { background: var(--surface-2) !important; color: var(--ink) !important; }
  .tj-calcell:not(:disabled):hover { outline: 2px solid var(--ink); outline-offset: -1px; }
  .tj-row:hover, .tj-tradeline:hover { background: var(--surface-2) !important; }
  .tj-tradeline:last-child { border-bottom: none !important; }

  .tj-select {
    padding: 7px 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 13px;
    font-family: inherit; font-weight: 600; background: var(--surface-2); color: var(--ink); cursor: pointer;
  }
  select:focus-visible, input:focus-visible, textarea:focus-visible {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent) 18%, transparent);
  }

  .tj-addslave {
    display: inline-flex; align-items: center; gap: 6px; padding: 10px 14px; border-radius: 11px;
    border: 1px dashed var(--border-strong); background: transparent; color: var(--ink-2);
    font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; transition: all .15s;
  }
  .tj-addslave:hover { border-color: var(--ink); color: var(--ink); background: var(--surface); }

  .tj-sidelink {
    display: flex; align-items: center; justify-content: center; gap: 7px; width: 100%;
    padding: 9px 12px; border-radius: 10px; border: 1px solid var(--border);
    background: transparent; color: var(--ink-2); font-family: inherit; font-size: 13px;
    font-weight: 600; cursor: pointer; transition: all .15s;
  }
  .tj-sidelink:hover { background: var(--surface-2); color: var(--ink); border-color: var(--border-strong); }

  .tj-scope {
    display: inline-flex; align-items: center; gap: 9px; padding: 8px 13px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--surface); color: var(--ink); cursor: pointer;
    font-family: inherit; font-size: 13.5px; transition: all .15s;
  }
  .tj-scope:hover { border-color: var(--border-strong); background: var(--surface-2); }
  .tj-scopeitem {
    display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 11px; border-radius: 9px;
    border: none; background: transparent; cursor: pointer; font-family: inherit; font-size: 13.5px;
    color: var(--ink); text-align: left; transition: background .12s;
  }
  .tj-scopeitem:hover { background: var(--surface-2); }

  /* scrollbar */
  ::-webkit-scrollbar { width: 11px; height: 11px; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 99px; border: 3px solid var(--bg); }
  ::-webkit-scrollbar-track { background: transparent; }

  @media (max-width: 720px) {
    aside { display: none; }
  }
</style>
